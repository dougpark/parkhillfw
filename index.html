<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Park Hill" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <script>
        (() => {
            const themeColors = {
                original: '#f0f4f9',
                'modern-lite': '#faf9f6',
                'modern-dark': '#2b2d42',
            };
            let theme = 'original';
            try {
                const savedTheme = localStorage.getItem('parkhill-theme');
                if (savedTheme && savedTheme in themeColors) theme = savedTheme;
            } catch {
                // Use the original theme when browser storage is unavailable.
            }
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').content = themeColors[theme];
            if (theme === 'modern-dark') {
                document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'black';
            }
        })();
    </script>
    <title>Park Hill Neighborhood</title>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
